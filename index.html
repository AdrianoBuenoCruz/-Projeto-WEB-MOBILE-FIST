<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Horta Comunitaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cadastro Horta Comunitaria</h1>

    <form action="#" method="POST">

        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(62) 99999-9999" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" placeholder="Rua, número e bairro" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <label for="confirmarSenha">Confirmar Senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required>

        <label for="tipoUsuario">Tipo de Usuário</label>
        <select id="tipoUsuario" name="tipoUsuario" required>
            <option value="">Selecione uma opção</option>
            <option value="doador">Doador</option>
            <option value="beneficiario">Beneficiário</option>
            <option value="voluntario">Voluntário</option>
        </select>

        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes" rows="4" placeholder="Informações adicionais"></textarea>

        <input type="submit" value="Cadastrar">
       

    </form>
    alert("Cadastro realizado com sucesso!");
    
<script src="cadastro.js"></script>
</body>
</html>
